<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profesional</title>
    <!-- Tailwind CSS para utilidades rápidas de centrado y diseño limpio -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Reseteo básico para asegurar que no haya márgenes externos ni barras innecesarias */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #f8fafc; /* Fondo neutro gris muy claro (Slate 50) */
            overflow-x: hidden;
        }

        /* Contenedor principal que centra el contenido vertical y horizontalmente */
        .center-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            width: 100%;
            padding: 16px;
            box-sizing: border-box;
        }

        /* Estilo específico para priorizar 1080x570px y mantener proporción en pantallas pequeñas */
        .featured-image {
            width: 1080px;
            height: 570px;
            max-width: 100%;
            height: auto;
            aspect-ratio: 1080 / 570;
            object-fit: cover;
            display: block;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
        }

        /* En pantallas mayores a 1112px (1080px + padding), forzamos el alto exacto de 570px */
        @media (min-width: 1112px) {
            .featured-image {
                width: 1080px;
                height: 570px;
            }
        }
    </style>
</head>
<body>
    <!-- Contenedor principal centrado -->
    <main class="center-wrapper">
        <!-- Imagen principal con fallback automático si "Profesional.jpg" no se encuentra en la ruta local -->
        <img 
            src="Profesional.jpg" 
            alt="Profesional" 
            class="featured-image"
            onerror="this.onerror=null; this.src='https://placehold.co/1080x570/e2e8f0/475569?text=Profesional.jpg+(1080x570)';"
        >
    </main>
</body>
</html>
